<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fcfcfc"/>

  <!-- Inner frame: thin rule echoing the site's typographic feel -->
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#dcdcdc" stroke-width="1.5"/>

  <!-- Brand: small caps, muted, top-left inside the frame -->
  <text x="100" y="130"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="400"
        letter-spacing="3"
        fill="#7a7a7a">
    FUNCTIONAL PROGRAMMER IN MOTION
  </text>

  <!-- Author name: large serif, the visual anchor -->
  <text x="100" y="305"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="84"
        font-weight="700"
        fill="#1a1a1a">
    Benjamin Thuillier
  </text>

  <!-- Tagline: serif italic, two lines for readability -->
  <text x="100" y="380"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-style="italic"
        fill="#4a4a4a">
    Notes on functional programming, distributed systems,
  </text>
  <text x="100" y="420"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-style="italic"
        fill="#4a4a4a">
    and the tools I build along the way.
  </text>

  <!-- Footer rule and URL: bottom of the frame -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#dcdcdc" stroke-width="1"/>
  <text x="100" y="545"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        fill="#7a7a7a">
    gilwath.com
  </text>
</svg>
