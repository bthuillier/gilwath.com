<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="YOCaml">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="{{ site.theme_color }}">

  {% if page_title is string %}
  <title>{{ page_title }} — {{ site.name }}</title>
  {% elseif title is string %}
  <title>{{ title }} — {{ site.name }}</title>
  {% else %}
  <title>{{ site.name }}</title>
  {% endif %}

  <meta name="description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author }}">

  <link rel="canonical" href="{{ site.url }}{% if page_url is string %}{{ page_url }}{% endif %}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="/atom.xml">

  <!-- Open Graph -->
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:type" content="{% if page_url is string %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page_title is string %}{{ page_title }}{% elseif title is string %}{{ title }}{% else %}{{ site.name }}{% endif %}">
  <meta property="og:description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{% if page_url is string %}{{ page_url }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if og_image is string %}{{ og_image }}{% else %}{{ site.og_image }}{% endif %}">
  <meta property="og:locale" content="{{ site.lang }}">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page_title is string %}{{ page_title }}{% elseif title is string %}{{ title }}{% else %}{{ site.name }}{% endif %}">
  <meta name="twitter:description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ site.url }}{% if og_image is string %}{{ og_image }}{% else %}{{ site.og_image }}{% endif %}">

  <!-- Federated identity verification (rel=me) -->
  <link rel="me" href="{{ site.github }}">
  <link rel="me" href="{{ site.linkedin }}">
  <link rel="me" href="{{ site.bluesky }}">
  <link rel="me" href="mailto:{{ site.email }}">

  <link rel="stylesheet" href="/style.css">

  <!-- Structured data: a single Person graph for search engines. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "email": "{{ site.email }}",
    "sameAs": [
      "{{ site.github }}",
      "{{ site.linkedin }}",
      "{{ site.bluesky }}"
    ]
  }
  </script>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="brand" href="/index.html">{{ site.name | lower }}</a>
      <nav>
        <a href="/index.html">About</a>
        <a href="/blog.html">Articles</a>
        <a href="/cv.html">CV</a>
      </nav>
    </header>

    {{safe (yocaml_body) }}

    <footer class="site-footer">
      <span>© 2026 {{ site.author }}</span>
      <span class="socials">
        <a href="{{ site.github }}" rel="me" aria-label="GitHub" title="GitHub">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#github"/></svg>
        </a>
        <a href="{{ site.linkedin }}" rel="me" aria-label="LinkedIn" title="LinkedIn">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#linkedin"/></svg>
        </a>
        <a href="{{ site.bluesky }}" rel="me" aria-label="Bluesky" title="Bluesky">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#bluesky"/></svg>
        </a>
        <a href="/atom.xml" type="application/atom+xml" aria-label="Atom feed" title="Atom feed">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#rss"/></svg>
        </a>
      </span>
      <span class="generator">
        <a href="https://ocaml.org" title="OCaml website">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/images/icons.svg#ocaml"/></svg>
        </a>
        Proudly generated by
        <a href="https://github.com/xhtmlboi/yocaml">YOCaml</a>.
      </span>
    </footer>

  </div>
</body>
</html>
