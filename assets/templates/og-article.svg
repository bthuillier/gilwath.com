<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#fdfcf7"/>

  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#d8cfb8" stroke-width="1.5"/>

  <text x="100" y="130"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="400"
        letter-spacing="3"
        fill="#7a7060">
    FUNCTIONAL PROGRAMMER IN MOTION
  </text>

  {% for line in title_lines %}
  <text x="100" y="{{ 230 + loop.index0 * 74 }}"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="60"
        font-weight="700"
        fill="#1a1a1a">{{ line }}</text>
  {% endfor %}

  {% if has_synopsis %}
  {% for line in synopsis_lines %}
  <text x="100" y="{{ 460 + loop.index0 * 38 }}"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26"
        font-style="italic"
        fill="#4a4030">{{ line }}</text>
  {% endfor %}
  {% endif %}

  <line x1="100" y1="540" x2="1100" y2="540" stroke="#d8cfb8" stroke-width="1"/>
  <text x="100" y="560"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18"
        fill="#7a7060">{{ author }}</text>
  <text x="1100" y="560"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18"
        fill="#7a7060"
        text-anchor="end">{{ url }}</text>
</svg>
