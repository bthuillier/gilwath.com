

<section>
  {{safe (yocaml_body) }}
</section>

{% if has_articles %}
<p class="section-label">Recently</p>
<ul class="post-list">
  {% for article in articles %}
  <li>
    <time datetime="{{ article.date.repr.date }}">{{ printf("%02d.%02d.%d", article.date.day, article.date.month, article.date.year) }}</time>
    <a href="{{ article.url }}">{{ article.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endif %}
